[project]
name = "team-retrospective-agent"
version = "0.1.0"
description = "Multi-agent Team Year-End Retrospective Agent built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.0.0",
  "pydantic>=2.7.0",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-dlp>=3.18.0",
  "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
